<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a3fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salon-Vorrat">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Salon-Vorrat</title>
<style>
:root{
  --bg:#f4f0f9; --muted:#6f6679; --line:#e7dfee;
  --text:#1d1626; --text-2:#2a2135;
  /* Flächen: nichts ist reinweiß – liegt etwas direkt auf dem Seiten-Hintergrund, wird es gedämpft */
  --page:#f4f0f9; --panel:#f3edf9; --pcard:#efe7f7; --sheet:#faf8fd; --input:#fff; --btn:#f6f2fb;
  --card:var(--btn);
  --bar:#e3daee;
  --accent:#7a3fbf; --accent2:#5f2d9b; --accent-soft:#f0e7fa;
  --green:#1f7a4d; --green-soft:#e2f5ea;
  --amber:#8f5a00; --amber-soft:#fdf0d3;
  --red:#b3261e; --red-soft:#fde7e5;
  --blue:#1f5fa8; --blue-soft:#e6effb;
  --radius:16px; --shadow:0 1px 2px rgba(30,20,45,.05),0 8px 24px rgba(30,20,45,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.4;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:940px;margin:0 auto;padding:0 14px calc(96px + var(--safe-b))}

/* Kopf */
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,240,249,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.topbar-in{max-width:940px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8d55d1,#5f2d9b);display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.topbar h1{font-size:19px;margin:0;letter-spacing:.2px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:-1px}
.icon-btn{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
.icon-btn:active{background:var(--accent-soft)}

/* Kacheln */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .num{font-size:24px;font-weight:700;line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}

/* Panels */
.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;margin-bottom:14px}
.section-title{display:flex;align-items:center;gap:8px;margin:4px 0 10px;font-size:17px}
.section-title .count{font-size:13px;font-weight:600;color:var(--muted)}
.section-title .spacer{flex:1}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--btn);color:var(--text-2);border-radius:12px;padding:9px 14px;min-height:44px;font-weight:600}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent2);border-color:transparent}
.btn-danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 10px;font-size:14px;border-radius:10px}
.btn-icon{width:40px;padding:0;flex:none}

/* Segmented control */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);min-height:40px}
.seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(30,20,45,.12)}
.seg[data-n="2"]{grid-template-columns:repeat(2,1fr)}

/* Formulare */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field > label,.lbl-s{font-size:13px;font-weight:600;color:var(--muted)}
.field .row{display:flex;gap:8px}
.row{display:flex;gap:8px}
.row > .field{flex:1;margin-bottom:0}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--input);color:var(--text);min-height:44px;outline:none}
input::placeholder,textarea::placeholder{color:#6b6275;opacity:1}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,63,191,.16)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5a5065 50%),linear-gradient(135deg,#5a5065 50%,transparent 50%);background-position:calc(100% - 20px) calc(50% + 1px),calc(100% - 14px) calc(50% + 1px);background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{min-height:80px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
.unit-suffix{position:relative}
.unit-suffix input{padding-right:52px}
.unit-suffix .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-2);opacity:.75;font-size:14px;font-weight:600;pointer-events:none}
details.adv{margin:2px 0 10px;border-top:1px dashed var(--line);padding-top:8px}
details.adv summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent2);padding:6px 0;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.adv[open] summary::before{transform:rotate(90deg)}
.err{color:var(--red);font-size:13px;font-weight:600;margin-bottom:10px}

/* Werkzeug-Leiste / Suche */
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:150px}
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.filter-chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--btn);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--text-2);flex:none}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Produktkarten */
.pcard{background:var(--pcard);border:1px solid #e0d5ee;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(60,35,90,.05)}
/* Liegt eine Karte auf einem Panel, hebt sie sich durch die hellere Fläche ab */
.panel .pcard{background:#faf7fe;border-color:var(--line)}
.pcard .shop-meta,.pcard .pmeta,.pcard .fc{color:#5b5266}
.pcard .btn:not(.btn-primary):not(.btn-soft):not(.btn-danger){background:#fbf9fe;border-color:#ded2ec}
.panel .pcard .btn:not(.btn-primary):not(.btn-soft):not(.btn-danger){background:#f3ecfb}
.pcard.dim{opacity:.55}
.phead{display:flex;align-items:flex-start;gap:8px}
.pmain{flex:1;min-width:0}
.pname{font-weight:700;font-size:16px;word-break:break-word;line-height:1.25}
.pmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.pstock{text-align:right;flex:none;font-weight:700;font-size:16px;line-height:1.2}
.pstock small{display:block;font-weight:600;font-size:11px;color:var(--muted);margin-top:2px}
.bar{height:7px;border-radius:99px;background:var(--bar);overflow:hidden;margin:9px 0 2px;position:relative}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pcard.st-ok .bar > i{background:var(--green)}
.pcard.st-warn .bar > i{background:#e0a100}
.pcard.st-empty .bar > i{background:var(--red)}
.pcard.st-empty .pstock,.pcard.st-empty .pstock small{color:var(--red)}
.pcard.st-warn .pstock,.pcard.st-warn .pstock small{color:var(--amber)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:8px}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.violet{background:var(--accent-soft);color:var(--accent2)}
.badge.gray{background:#e7e0ef;color:#4c4258}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.pactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.paction{flex:1;min-width:0}

/* Vorhersage / Reichweite */
.fc{font-size:12.5px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.fc b{color:var(--text)}
.fc .full{color:var(--red);font-weight:700}

/* Einkaufsliste */
.shop-item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.shop-item input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent);flex:none;margin:0}
.shop-main{flex:1;min-width:0}
.shop-name{font-weight:700;word-break:break-word}
.shop-name.done{text-decoration:line-through;color:var(--muted);font-weight:600}
.shop-meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.shop-actions{display:flex;gap:6px;flex:none}
.totals{font-size:13px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px}

/* Verlauf */
.hist{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.hist:last-child{border-bottom:0}
.hist .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.hist .ic.out{background:var(--red-soft)}
.hist .ic.in{background:var(--green-soft)}
.hist .ic.adj{background:var(--blue-soft)}
.hist-main{flex:1;min-width:0}
.hist-qty{font-weight:700;flex:none}

.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:14px}

/* Bottom-Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{max-width:940px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button .gl{font-size:19px;line-height:1}
.nav button.active{color:var(--accent)}
.nav .nav-badge{position:absolute;top:2px;right:50%;transform:translateX(20px);min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:18px;bottom:calc(74px + var(--safe-b));z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,#8d55d1,#5f2d9b);color:#fff;font-size:28px;line-height:1;box-shadow:0 8px 20px rgba(95,45,155,.35);display:grid;place-items:center}

/* Modal / Sheet */
.modal{position:fixed;inset:0;z-index:40;background:rgba(25,15,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--safe-b));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{font-size:18px;margin:0;flex:1}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .btn{flex:1}
.text-link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline}
.danger-link{color:var(--red)}

/* Toast */
#toasts{position:fixed;left:0;right:0;top:calc(8px + var(--safe-t));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:520px;width:100%;background:#2a2035;color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.warn{background:#8a4b00}
.toast.err{background:#9b1c14}
.toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;margin-left:auto;min-height:36px;flex:none}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}

/* Menü */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-grid .btn{justify-content:flex-start;text-align:left}
.danger-zone{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

@media (min-width:720px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .modal{align-items:center}
  .sheet{border-radius:22px;max-height:88vh;padding-bottom:16px}
  .fab{bottom:calc(86px);right:calc(50% - 450px)}
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17131d;--card:#2a2333;--text:#efe9f6;--text-2:#e8e0f2;--muted:#a79fb3;--line:#332b3e;--accent:#a77ae0;--accent2:#c7a6f2;--accent-soft:#33264a;--green:#6fd39c;--green-soft:#1b3427;--amber:#f0b44c;--amber-soft:#3a2c12;--red:#ff8a80;--red-soft:#3c1d1d;--blue:#8cb8f0;--blue-soft:#1b2940;
    --page:#17131d;--panel:#221c2b;--pcard:#2b2336;--sheet:#221c2b;--input:#2e2639;--btn:#2a2333;--bar:#3a3146}
  .topbar{background:rgba(23,19,29,.9)}
  .seg button.active{background:var(--card)}
  .nav{background:rgba(34,28,43,.96)}
  .panel .pcard{background:#271f31;border-color:#3a3046}
  .pcard .shop-meta,.pcard .pmeta,.pcard .fc{color:var(--muted)}
  .pcard .btn:not(.btn-primary):not(.btn-soft):not(.btn-danger),.panel .pcard .btn:not(.btn-primary):not(.btn-soft):not(.btn-danger){background:#332a40;border-color:#443a54}
  .badge.gray{background:#332b3e;color:#cfc6da}
  .modal{background:rgba(0,0,0,.6)}
  input::placeholder,textarea::placeholder{color:#968da2}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo">✂</div>
    <div>
      <h1>Salon-Vorrat</h1>
      <div class="sub" id="today">–</div>
    </div>
    <button class="icon-btn" id="btn-menu" aria-label="Menü">☰</button>
  </div>
</header>

<main class="wrap">
  <section id="view-overview"></section>
  <section id="view-list" class="hidden"></section>
  <section id="view-shop" class="hidden"></section>
  <section id="view-history" class="hidden"></section>
</main>

<button class="fab hidden" id="fab" aria-label="Neues Produkt">+</button>

<nav class="nav">
  <div class="nav-in">
    <button data-tab="overview" class="active"><span class="gl">▦</span>Übersicht</button>
    <button data-tab="list"><span class="gl">☷</span>Produkte</button>
    <button data-tab="shop"><span class="gl">🛒</span>Einkauf<span class="nav-badge hidden" id="nav-badge"></span></button>
    <button data-tab="history"><span class="gl">↺</span>Verlauf</button>
    <button data-tab="menu"><span class="gl">☰</span>Mehr</button>
  </div>
</nav>

<div id="toasts"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* =====================================================================
   Salon-Vorrat – Vorrats- & Einkaufsverwaltung (lokal im Browser)
   Alle Daten bleiben auf diesem Gerät (localStorage).
   ===================================================================== */

const KEY = 'salon-vorrat-v1';
const DEFAULTS = {
  v: 1,
  products: [],       // {id,name,category,unit,stock,min,warn,cost,note,snooze:{until,level},created}
  log: [],            // {id,t,pid,type('out'|'in'|'adj'),qty,note}
  shop: [],           // {id,pid,name,unit,qty,note,done,added}
  settings: {stepOut: 1, stepIn: 1, retentionDays: 180, retainProduct: 15}
};

let state = load();
let ui = {
  tab: 'overview',
  tabBeforeMenu: 'overview',
  search: '',
  filter: 'all',
  catFilter: 'all',
  histFilter: 'all',
  histTodayOnly: false,
  shopShowDone: true,
  listOpen: {},        // Produktkarte aufgeklappt? (Reichweite sichtbar)
};

/* ---------------- Speicher ---------------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULTS), d, {
      settings: Object.assign({}, DEFAULTS.settings, d.settings||{}),
      products: Array.isArray(d.products)? d.products : [],
      log: Array.isArray(d.log)? d.log : [],
      shop: Array.isArray(d.shop)? d.shop : []
    });
  }catch(e){
    console.error(e);
    return structuredClone(DEFAULTS);
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Speichern fehlgeschlagen! Ist der Speicher voll/gesperrt?', 'err'); }
}

/* ---------------- Hilfsfunktionen ---------------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const DAY = 86400000;
const nf2 = new Intl.NumberFormat('de-DE', {maximumFractionDigits: 2});
const money = n => (Number(n)||0).toLocaleString('de-DE', {style:'currency', currency:'EUR'});
function fmtQty(n){
  const r = Math.round((Number(n)||0) * 100) / 100;
  return nf2.format(r);
}
function fmtDate(t){
  const d = new Date(t);
  if(d.getFullYear() === new Date().getFullYear()) return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'});
  return d.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit'});
}
function fmtTime(t){
  return new Date(t).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
}
function fmtDateTime(t){ return fmtDate(t) + ', ' + fmtTime(t); }
function daysBetween(a, b){ return (b - a) / DAY; }
function relDays(n){
  n = Math.round(n);
  if(n <= 0) return 'heute';
  if(n === 1) return 'morgen';
  return 'in ' + n + ' Tagen';
}
/* „2 Tube“ / „2 Tuben“ / „1 Liter“ – nur für Einheiten, wo der Plural sicher ist */
function qtyUnit(n, unit){
  const u = String(unit || '').trim();
  const plural = {'Tube':'Tuben','Flasche':'Flaschen','Dose':'Dosen','Packung':'Packungen','Rolle':'Rollen','Beutel':'Beutel','Paar':'Paar','Karton':'Kartons','Stück':'Stück'};
  const many = Math.abs(Number(n)||0) !== 1;
  return fmtQty(n) + ' ' + esc(many && plural[u] ? plural[u] : u);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }

const UNITS = ['Stück','Packung','Flasche','Dose','Tube','ml','Liter','g','kg','Beutel','Rolle','Paar','Karton'];
const CATEGORIES = ['Haarpflege','Farben & Blondierung','Shampoo & Spülung','Stapel- & Stylingprodukte','Styling & Finish','Einweg & Hygiene','Reinigung','Getränke & Verpflegung','Büro & Sonstiges','Sonstiges'];
const CATEGORY_ICONS = {
  'Haarpflege':'💆','Farben & Blondierung':'🎨','Shampoo & Spülung':'🧴','Stapel- & Stylingprodukte':'🌀',
  'Styling & Finish':'💨','Einweg & Hygiene':'🧻','Reinigung':'🧽','Getränke & Verpflegung':'☕',
  'Büro & Sonstiges':'📎','Sonstiges':'📦'
};
const ic = c => CATEGORY_ICONS[c] || '📦';

/* Status: 'empty' (leer), 'warn' (Melden unter/erreicht), 'ok' */
function statusOf(p){
  const stock = Number(p.stock)||0;
  if(stock <= 0) return 'empty';
  const w = p.warn === null || p.warn === undefined || p.warn === '' ? null : Number(p.warn);
  if(w !== null && stock <= w) return 'warn';
  if(stock <= (Number(p.min)||0)) return 'warn';
  return 'ok';
}
function minOf(p){ return Number(p.min)||0; }
function warnOf(p){ return p.warn === null || p.warn === undefined || p.warn === '' ? null : Number(p.warn); }
function levelOf(p){
  const s = statusOf(p);
  return s === 'empty' ? 2 : (s === 'warn' ? 1 : 0);
}
function suggestQty(p){
  // Vorschlag: bis auf Mindestbestand + 50% Puffer auffüllen, mind. 1
  const stock = Number(p.stock)||0, min = minOf(p);
  let q = Math.max(min * 1.5 - stock, (min || 1) * 0.5);
  if(q <= 0) q = 1;
  return Math.max(1, Math.round(q * 100) / 100);
}
function productsSorted(){
  return [...state.products].sort((a, b) => {
    const la = levelOf(a), lb = levelOf(b);
    if(la !== lb) return lb - la;
    const ca = a.category || 'zzz', cb = b.category || 'zzz';
    if(ca !== cb) return ca.localeCompare(cb, 'de');
    return (a.name||'').localeCompare(b.name||'', 'de');
  });
}
function productById(id){ return state.products.find(p => p.id === id); }

/* Vorhersage aus Verbrauchshistorie */
function forecastOf(p, days = 60){
  const out = state.log.filter(e => e.pid === p.id && e.type === 'out' && Number(e.qty) > 0);
  if(out.length === 0) return null;
  const since = Date.now() - days * DAY;
  const recent = out.filter(e => e.t >= since);
  if(recent.length === 0) return null;
  const total = recent.reduce((s, e) => s + Number(e.qty), 0);
  const firstT = Math.min(...recent.map(e => e.t));
  const spanDays = Math.max(daysBetween(firstT, Date.now()), 1);
  const perDay = total / spanDays;
  if(perDay <= 0) return null;
  const last = out.reduce((m, e) => e.t > m.t ? e : m, out[0]);
  return {
    perDay,
    perWeek: perDay * 7,
    stock: Number(p.stock)||0,
    lastUse: last.t,
    events: recent.length,
    daysLeft: (Number(p.stock)||0) / perDay,
    daysToMin: Math.max(0, ((Number(p.stock)||0) - minOf(p)) / perDay),
    orderInDays: Math.max(0, ((Number(p.stock)||0) - minOf(p)) / perDay),
  };
}
function fmtPerDay(perDay, unit){
  if(perDay >= 1) return qtyUnit(perDay, unit) + ' pro Tag';
  if(perDay * 7 >= 0.5) return qtyUnit(perDay * 7, unit) + ' pro Woche';
  return qtyUnit(perDay * 30, unit) + ' pro Monat';
}
function reachText(days){
  if(days >= 90) return 'über 3 Monaten';
  if(days >= 2) return 'ca. ' + Math.round(days) + ' Tagen';
  if(days >= 1) return 'ca. 1 Tag';
  if(days >= 0.5) return 'ca. einem halben Tag';
  return 'weniger als einen Tag';
}
function fcLine(p){
  const f = forecastOf(p);
  if(!f) return '';
  const reach = f.daysLeft;
  return `<div class="fc">📈 Verbrauch zuletzt: <b>${fmtPerDay(f.perDay, p.unit||'')}</b> · reicht noch <b${reach < 7 ? ' class="full"' : ''}>${reachText(reach)}</b><br>
  Zuletzt verbraucht: ${fmtDate(f.lastUse)} · Wenn es so weitergeht, bis spätestens <b>${f.orderInDays >= 90 ? 'erst in einigen Monaten' : relDays(f.orderInDays)}</b> nachbestellen.</div>`;
}

/* Warnung unterdrücken („Später“) */
function isSnoozed(p){
  const s = p.snooze;
  return !!(s && s.until > Date.now() && s.level >= levelOf(p));
}
function snooze(p, hours){
  p.snooze = { until: Date.now() + hours * 3600000, level: levelOf(p) };
  save(); render();
}
function blockedByShop(p){
  const stock = Number(p.stock)||0;
  return state.shop.some(s => s.pid === p.id && !s.done);
}
/* Produkte, für die eine Warnung angezeigt werden soll */
function alertProducts(){
  return productsSorted().filter(p => levelOf(p) > 0 && !isSnoozed(p) && !blockedByShop(p));
}

/* ---------------- Aktionen ---------------- */
function addProduct(data){
  const p = {
    id: uid(),
    name: data.name.trim(),
    category: data.category || 'Sonstiges',
    unit: data.unit || 'Stück',
    stock: Number(data.stock) || 0,
    min: Number(data.min) || 0,
    warn: data.warn === '' || data.warn === null || data.warn === undefined ? null : Number(data.warn),
    cost: data.cost === '' || data.cost === null || data.cost === undefined ? null : Number(data.cost),
    note: (data.note || '').trim() || null,
    snooze: null,
    created: Date.now(),
  };
  if(p.warn === null) p.warn = p.min;
  state.products.push(p);
  state.log.unshift({ id: uid(), t: Date.now(), pid: p.id, type: 'adj', qty: p.stock, note: 'Anfangsbestand' });
  save(); render();
  return p;
}
function updateProduct(id, data){
  const p = productById(id); if(!p) return;
  const oldStock = Number(p.stock)||0;
  Object.assign(p, {
    name: data.name.trim(),
    category: data.category || 'Sonstiges',
    unit: data.unit || 'Stück',
    stock: Number(data.stock) || 0,
    min: Number(data.min) || 0,
    warn: data.warn === '' || data.warn === null || data.warn === undefined ? null : Number(data.warn),
    cost: data.cost === '' || data.cost === null || data.cost === undefined ? null : Number(data.cost),
    note: (data.note || '').trim() || null,
  });
  if(p.warn === null) p.warn = p.min;
  if(p.stock !== oldStock) {
    state.log.unshift({ id: uid(), t: Date.now(), pid: p.id, type: 'adj', qty: p.stock, note: 'Bestand angepasst' });
    p.snooze = null;
  }
  save(); render();
}
function deleteProduct(id){
  const p = productById(id); if(!p) return;
  state.products = state.products.filter(x => x.id !== id);
  state.shop = state.shop.filter(s => s.pid !== id);
  save(); render();
  toast(`„${p.name}“ wurde gelöscht.`, 'err', { label: 'Rückgängig', fn: () => {
    state.products.push(p); save(); render();
  }});
}
function addLog(entry){
  state.log.unshift(entry);
  if(state.log.length > 2000) state.log.length = 2000;
}
function book(type, pid, qty, note){
  const p = productById(pid); if(!p) return null;
  qty = Number(qty);
  if(!(qty > 0)) return null;
  const before = Number(p.stock)||0;
  if(type === 'out') p.stock = Math.round((before - qty) * 100) / 100;
  else if(type === 'in') p.stock = Math.round((before + qty) * 100) / 100;
  else p.stock = Math.round(qty * 100) / 100;
  const e = { id: uid(), t: Date.now(), pid, type, qty: type === 'adj' ? p.stock : qty, before, note: note || null };
  addLog(e);
  p.snooze = null;
  // Wiederauffüllen: offene Einkaufslisten-Einträge entfernen? Nein – erst beim Abhaken.
  save(); render();
  return e;
}
function undoLog(id){
  const e = state.log.find(x => x.id === id); if(!e) return;
  const p = productById(e.pid); if(!p) return;
  const before = e.before;
  const now = Number(p.stock)||0;
  if(e.type === 'out') p.stock = Math.round((now + Number(e.qty)) * 100) / 100;
  else if(e.type === 'in') p.stock = Math.max(0, Math.round((now - Number(e.qty)) * 100) / 100);
  else p.stock = before ?? now;
  state.log = state.log.filter(x => x.id !== id);
  save(); render();
  toast('Eintrag rückgängig gemacht.');
}
function removeLog(id){
  state.log = state.log.filter(x => x.id !== id);
  save(); render();
  toast('Eintrag wurde entfernt.');
}

function findShopFor(id){ return state.shop.find(s => s.pid === id && !s.done && !s.manual); }
function addToShopping(pid, qty, note){
  const p = productById(pid); if(!p) return;
  const existing = findShopFor(pid);
  if(existing){ existing.qty = Math.max(Number(existing.qty)||0, Number(qty)||0); if(note) existing.note = note; }
  else state.shop.push({ id: uid(), pid, name: p.name, unit: p.unit, qty: Math.max(0.01, Number(qty)||1), note: note||null, done: false, added: Date.now(), auto: true });
  save(); render();
  toast(`„${p.name}“ steht auf der Einkaufsliste.`);
}
function addAllSuggested(){
  let n = 0;
  for(const p of alertProducts()){
    if(findShopFor(p.id)) continue;
    state.shop.push({ id: uid(), pid: p.id, name: p.name, unit: p.unit, qty: suggestQty(p), note: null, done: false, added: Date.now(), auto: true });
    n++;
  }
  save(); render();
  toast(n > 0 ? `${n} Produkt(e) auf die Einkaufsliste gesetzt.` : 'Alles steht schon auf der Liste.');
}
function addManualShop(){
  openModal('add', { manual: true });
}
function toggleShop(id){
  const s = state.shop.find(x => x.id === id); if(!s) return;
  if(!s.done){
    // Ware eingekauft → in Bestand buchen
    const p = productById(s.pid);
    if(p && Number(s.qty) > 0){
      book('in', s.pid, s.qty, 'Einkauf' + (s.note ? ': ' + s.note : ''));
      const stillOpen = findShopFor(s.pid);
      if(stillOpen && stillOpen.id !== s.id) stillOpen.qty = 0;
    }
    s.done = true; s.doneAt = Date.now();
    save(); render();
    toast(p ? `${qtyUnit(s.qty, p.unit)} „${p.name}“ in den Bestand gebucht.` : 'Abgehakt.', 'ok', { label: 'Rückgängig', fn: () => {
      s.done = false; delete s.doneAt;
      if(p && Number(s.qty) > 0){
        p.stock = Math.round(((Number(p.stock)||0) - Number(s.qty)) * 100) / 100;
        state.log = state.log.filter(e => !(e.pid === s.pid && e.type === 'in' && e.note && e.note.startsWith('Einkauf') && Math.abs(e.t - (s.doneAt||0)) < 5000));
      }
      save(); render();
    }});
  } else {
    s.done = false; delete s.doneAt;
    save(); render();
  }
}
function removeShop(id){
  const i = state.shop.findIndex(x => x.id === id); if(i < 0) return;
  const [s] = state.shop.splice(i, 1);
  save(); render();
  toast('Von der Einkaufsliste entfernt.', 'ok', { label: 'Rückgängig', fn: () => { state.shop.splice(i, 0, s); save(); render(); }});
}
function shopCost(s){
  const p = productById(s.pid);
  if(!p || p.cost === null || p.cost === undefined) return null;
  return Number(p.cost) * Number(s.qty);
}
function totalShopCost(list){
  let sum = 0, known = 0, unknown = 0;
  for(const s of list){
    const c = shopCost(s);
    if(c === null) unknown++; else { sum += c; known++; }
  }
  return { sum, known, unknown };
}

  $$('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));

  const open = state.shop.filter(s => !s.done).length;

  nb.textContent = open; nb.classList.toggle('hidden', open === 0);

  if(ui.tab === 'overview') renderOverview();

}

  }
  html += `</div>`;
  $('#view-overview').innerHTML = html;
}
function forSoonList(){
  const out = [];
  for(const p of state.products){
    const f = forecastOf(p);
    if(!f) continue;
    const days = f.daysToMin; // Tage bis Mindestbestand erreicht
    if(days <= 21) out.push({ p, f, days });
  }
  return out.sort((a, b) => a.days - b.days).slice(0, 8);
}

function stockPct(p){

function renderShop(){
  const open = state.shop.filter(s => !s.done).sort((a, b) => a.added - b.added);
  const done = state.shop.filter(s => s.done).sort((a, b) => (b.doneAt||0) - (a.doneAt||0));
  const st = totalShopCost(open);
  // Auf der Liste stehende Produkte, die man nachbestellen sollte, aber nicht drauf sind
  const missing = alertProducts().filter(p => !state.shop.some(s => s.pid === p.id && !s.done));

  let html = `<div class="section-title">🛒 Einkaufsliste <span class="count">${open.length}</span></div>`;
  if(missing.length){
    html += `<div class="panel" style="background:var(--red-soft);border-color:transparent">
      <div style="font-weight:700;margin-bottom:8px;color:var(--red)">${missing.length} Produkt(e) müssen nachbestellt werden:</div>
      <div class="badges" style="margin-bottom:10px">${missing.map(p => `<span class="badge red">${esc(p.name)} · ${qtyUnit(suggestQty(p), p.unit)}</span>`).join(' ')}</div>
      <button class="btn btn-primary btn-block" data-act="add-all">Alle auf die Einkaufsliste</button>
    </div>`;
  }
  html += `<div class="panel">`;
  if(open.length === 0){
    html += `<div class="empty">Die Einkaufsliste ist leer.<br><br>Produkte landen automatisch hier, wenn sie melden – oder du fügst sie manuell hinzu.</div>`;
  } else {
    for(const s of open){
      const p = productById(s.pid);
      const c = shopCost(s);
      html += `<div class="shop-item">
        <input type="checkbox" data-act="shop-done" data-id="${s.id}" aria-label="Gekauft">
        <div class="shop-main">
          <div class="shop-name">${p ? ic(p.category) : '📦'} ${esc(s.name)}</div>
          <div class="shop-meta">${esc(s.note || (p ? p.category : ''))}${p ? ` · Bestand: ${fmtQty(p.stock)} ${esc(p.unit)}` : ''}${c !== null ? ' · ' + money(c) : ''}</div>
        </div>
        <div class="shop-actions">
          <input type="number" inputmode="decimal" step="any" min="0" value="${String(Math.round((Number(s.qty)||0)*100)/100)}" data-act="shop-qty" data-id="${s.id}" style="width:78px;min-height:38px;padding:6px 8px;text-align:center" aria-label="Menge ${esc(s.unit||'')}">
          <button class="btn btn-sm btn-icon" data-act="shop-remove" data-id="${s.id}" title="Entfernen">✕</button>
        </div>
      </div>`;
    }
    html += `<div class="totals"><span>Geschätzte Kosten: <b>${money(st.sum)}</b></span>${st.unknown ? `<span>· ${st.unknown} Produkt(e) ohne Preis</span>` : ''}</div>`;
  }
  html += `<div class="sheet-actions" style="margin-top:12px">
      <button class="btn btn-soft" data-act="shop-manual">+ Stichpunkt</button>
      <button class="btn" data-act="shop-clear-done">✓ Gekauftes (${done.length}) löschen</button>
    </div></div>`;

  if(done.length && ui.shopShowDone){
    html += `<div class="panel"><div class="section-title">Erledigt <span class="count">${done.length}</span></div>`;
    for(const s of done) html += `<div class="shop-item">
      <input type="checkbox" checked data-act="shop-done" data-id="${s.id}" aria-label="Wieder öffnen">
      <div class="shop-main"><div class="shop-name done">${esc(s.name)}</div><div class="shop-meta">${qtyUnit(s.qty, s.unit)}${s.doneAt ? ' · ' + fmtDate(s.doneAt) : ''}</div></div>
      <div class="shop-actions"><button class="btn btn-sm btn-icon btn-danger" data-act="shop-remove" data-id="${s.id}" title="Löschen">✕</button></div>
    </div>`;
    html += `</div>`;
  }
  $('#view-shop').innerHTML = html;
}

function renderHistory(){
  let entries = [...state.log].sort((a, b) => b.t - a.t);
  if(ui.histFilter === 'out') entries = entries.filter(e => e.type === 'out');
  if(ui.histFilter === 'in') entries = entries.filter(e => e.type === 'in');
  if(ui.histFilter === 'adj') entries = entries.filter(e => e.type === 'adj');
  if(ui.histTodayOnly){ const t0 = startOfToday(); entries = entries.filter(e => e.t >= t0); }
  const shown = entries.slice(0, 300);

  let html = `<div class="section-title">↺ Verlauf</div>
    <div class="filter-chips">
      <button class="chip ${ui.histFilter==='all'?'active':''}" data-act="hf" data-f="all">Alle</button>
      <button class="chip ${ui.histFilter==='out'?'active':''}" data-act="hf" data-f="out">Verbrauch</button>
      <button class="chip ${ui.histFilter==='in'?'active':''}" data-act="hf" data-f="in">Eingang</button>
      <button class="chip ${ui.histFilter==='adj'?'active':''}" data-act="hf" data-f="adj">Bestand</button>
      <button class="chip ${ui.histTodayOnly?'active':''}" data-act="hf-today">Nur heute</button>
    </div>
    <div class="panel">`;
  if(shown.length === 0){
    html += `<div class="empty">Noch keine Einträge.</div>`;
  } else {
    let lastDay = null;
    for(const e of shown){
      const dayKey = new Date(e.t).toDateString();
      if(dayKey !== lastDay){
        lastDay = dayKey;
        const t0 = new Date(e.t); t0.setHours(0,0,0,0);
        const label = t0.getTime() === startOfToday() ? 'Heute' : (t0.getTime() === startOfToday() - DAY ? 'Gestern' : t0.toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'}));
        html += `<div class="pmeta" style="font-weight:700;color:var(--text);margin:12px 0 2px">${esc(label)}</div>`;
      }
      const p = productById(e.pid);
      const name = p ? p.name : 'Gelöschtes Produkt';
      const unit = p ? p.unit : '';
      const cls = e.type === 'out' ? 'out' : e.type === 'in' ? 'in' : 'adj';
      const icon = e.type === 'out' ? '−' : e.type === 'in' ? '+' : '✎';
      const qtyTxt = e.type === 'adj' ? fmtQty(e.qty) + ' ' + esc(unit) : (e.type === 'out' ? '−' : '+') + fmtQty(e.qty) + ' ' + esc(unit);
      html += `<div class="hist">
        <div class="ic ${cls}">${icon}</div>
        <div class="hist-main">
          <div class="shop-name" style="font-size:15px">${esc(name)}</div>
          <div class="shop-meta">${fmtTime(e.t)} · ${e.type === 'out' ? 'verbraucht' : e.type === 'in' ? 'Eingang' : 'Bestand gesetzt'}${e.note ? ' · ' + esc(e.note) : ''}</div>
        </div>
        <div class="hist-qty">${qtyTxt}</div>
        <button class="btn btn-sm btn-icon" data-act="hist-undo" data-id="${e.id}" title="Rückgängig">↺</button>
        <button class="btn btn-sm btn-icon" data-act="hist-remove" data-id="${e.id}" title="Eintrag löschen" style="color:var(--muted)">✕</button>
      </div>`;
    }
    if(entries.length > shown.length) html += `<div class="empty">… ${entries.length - shown.length} ältere Einträge ausgeblendet</div>`;
  }
  html += `</div>`;
  $('#view-history').innerHTML = html;
}

/* ---------------- Modal (Bottom-Sheet) ---------------- */
let modal = null;
function closeModal(){
  if(modal && modal.onClose) modal.onClose();
  modal = null;
  $('#modal-root').innerHTML = '';
}
function openModal(kind, opts = {}){
  let html = '';
  if(kind === 'add' || kind === 'edit') html = productForm(kind, opts);
  else if(kind === 'out' || kind === 'in') html = bookForm(kind, opts);
  else if(kind === 'menu') html = menuSheet();
  else if(kind === 'settings') html = settingsSheet();
  else if(kind === 'help') html = helpSheet();

  $('#modal-root').innerHTML = `<div class="modal" data-overlay><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const overlay = $('[data-overlay]');
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });

  // Autofokus
  const first = overlay.querySelector('[autofocus]');
  if(first) setTimeout(() => { first.focus(); if(first.select) first.select(); }, 60);
  // Enter im Namensfeld springt weiter / speichert
  const form = overlay.querySelector('form');
  if(form){
    form.addEventListener('submit', ev => { ev.preventDefault(); submitModalForm(); });
    form.addEventListener('keydown', ev => {
      if(ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'checkbox'){
        ev.preventDefault();
        const fields = $$('input,select,textarea', form).filter(f => !f.disabled && f.offsetParent !== null);
        const i = fields.indexOf(ev.target);
        if(i >= 0 && i < fields.length - 1) fields[i + 1].focus(); else submitModalForm();
      }
    });
  }
}
/* Fertiges Sheet ohne Formular anzeigen */

  openModal('raw');
  $('#modal-root').innerHTML = `<div class="modal" data-overlay><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;

/* Formular absenden */
function submitModalForm(){
  const f = $('#product-form');
  if(f){
    const kind = f.dataset.kind, id = f.dataset.id;
    const data = Object.fromEntries(new FormData(f));
    if(!data.name || !data.name.trim()){ toast('Bitte einen Namen eingeben.', 'err'); return; }
    if(kind === 'edit') updateProduct(id, data); else addProduct(data);
    closeModal();
    toast(kind === 'edit' ? 'Produkt gespeichert.' : 'Produkt angelegt.');
    return;
  }
  const b = $('#book-form');
  if(b){
    const type = b.dataset.kind, pid = b.dataset.id;
    const qty = parseFloat(String(new FormData(b).get('qty') || '').replace(',', '.'));
    if(!(qty >= 0) || (type !== 'adj' && !(qty > 0))){ toast('Bitte eine gültige Menge eingeben.', 'err'); return; }
    const p = productById(pid);
    const e = book(type, pid, qty, new FormData(b).get('note'));
    closeModal();
    if(!p) return;
    const label = type === 'out' ? 'Verbraucht' : type === 'in' ? 'Eingang gebucht' : 'Bestand gesetzt';
    const low = levelOf(p) > 0;
    toast(`${label}: ${qtyUnit(qty, p.unit)} „${p.name}“ · Bestand jetzt ${qtyUnit(p.stock, p.unit)}${low ? ' – bald nachbestellen!' : ''}`,
      low ? 'warn' : 'ok', { label: '↺ Rückgängig', fn: () => e && undoLog(e.id) });
    // Bei Knappheit direkt Nachbestellen anbieten
    if(type === 'out' && low && !blockedByShop(p)){
      showSheet(`<div class="sheet-head"><h2>${ic(p.category)} ${esc(p.name)}</h2><button class="btn btn-icon" data-act="modal-close" aria-label="Schließen">✕</button></div>
        <p style="margin:0 0 12px">Der Bestand ist jetzt bei <b>${qtyUnit(p.stock, p.unit)}</b> (Mindestbestand ${qtyUnit(minOf(p), p.unit)}). Soll es auf die Einkaufsliste?</p>
        <div class="sheet-actions">
          <button class="btn" data-act="modal-close">Später</button>
          <button class="btn btn-primary" data-act="shop-add" data-id="${p.id}" data-qty="${suggestQty(p)}">🛒 ${qtyUnit(suggestQty(p), p.unit)} auf die Liste</button>
        </div>`);
    }
    return;
  }
  const s = $('#settings-form');
  if(s){
    const d = Object.fromEntries(new FormData(s));
    state.settings.stepOut = Number(d.stepOut) || 1;
    state.settings.stepIn = Number(d.stepIn) || 1;
    state.settings.retentionDays = Number(d.retentionDays) || 180;
    save(); closeModal(); render();
    toast('Einstellungen gespeichert.');
  }
}

/* ---------------- Toasts ---------------- */
function toast(msg, kind = 'ok', action = null, action2 = null){
  const root = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'warn' ? 'warn' : kind === 'err' ? 'err' : '');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if(action2){
    const b2 = document.createElement('button');
    b2.textContent = action2.label;
    b2.addEventListener('click', () => { action2.fn(); dismiss(); });
    el.appendChild(b2);
  }
  if(action){
    const b = document.createElement('button');
    b.textContent = action.label;
    b.addEventListener('click', () => { action.fn(); dismiss(); });
    el.appendChild(b);
  }
  root.appendChild(el);
  const t = setTimeout(dismiss, action || action2 ? 7000 : 3500);
  function dismiss(){ clearTimeout(t); el.remove(); }
  while(root.children.length > 3) root.firstElementChild.remove();
}

/* ---------------- Backup / Import ---------------- */
function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function doExport(){
  download(`salon-vorrat-backup-${stamp()}.json`, JSON.stringify(state, null, 2), 'application/json');
  toast('Backup wurde gespeichert.');
}
function doExportCsv(){
  const rows = [['Datum','Uhrzeit','Produkt','Kategorie','Aktion','Menge','Einheit','Notiz']];
  for(const e of [...state.log].sort((a, b) => a.t - b.t)){
    const p = productById(e.pid);
    const d = new Date(e.t);
    rows.push([d.toLocaleDateString('de-DE'), d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}),
      p ? p.name : '', p ? p.category : '', e.type === 'out' ? 'Verbrauch' : e.type === 'in' ? 'Eingang' : 'Bestand',
      String(e.qty).replace('.', ','), p ? p.unit : '', e.note || '']);
  }
  const csv = '\ufeff' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  download(`salon-vorrat-verlauf-${stamp()}.csv`, csv, 'text/csv;charset=utf-8');
  toast('Tabelle wurde gespeichert.');
}
function handleImportFile(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.products)) throw new Error('Format');
      if(!confirm(`Backup laden?\n\nEnthält ${d.products.length} Produkte.\nDie aktuellen Daten auf diesem Gerät werden überschrieben.`)) return;
      state = Object.assign(structuredClone(DEFAULTS), d, {settings: Object.assign({}, DEFAULTS.settings, d.settings||{})});
      save(); closeModal(); render();
      toast('Backup geladen.');
    }catch(e){ toast('Diese Datei konnte nicht gelesen werden.', 'err'); }
  };
  r.readAsText(file);
}

/* ---------------- Events ---------------- */
document.addEventListener('click', ev => {
  const navBtn = ev.target.closest('.nav button');
  if(navBtn){
    const t = navBtn.dataset.tab;
    if(t === 'menu'){ openMenu(); return; }
    ui.tab = t; render();
    window.scrollTo({top: 0});
    return;
  }
  const fab = ev.target.closest('#fab');
  if(fab){ openModal('add'); return; }

  const el = ev.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  switch(act){
    case 'new-product': closeModal(); openModal('add'); break;
    case 'edit-product': closeModal(); openModal('edit', {id}); break;
    case 'modal-close': closeModal(); break;
    case 'quick-out': closeModal(); openModal('out', {id}); break;
    case 'quick-in': closeModal(); openModal('in', {id}); break;
    case 'adj-exact': { const p = productById(id); if(p){ closeModal(); } break; }
    case 'del-product': {
      const p = productById(id); if(!p) return;
      if(!confirm(`„${p.name}“ wirklich löschen? (Der Verlauf bleibt teilweise erhalten.)`)) return;
      closeModal(); deleteProduct(id); break;
    }
    case 'shop-add': { closeModal(); addToShopping(id, Number(el.dataset.qty) || 1, null); break; }
    case 'add-all': addAllSuggested(); break;
    case 'snooze': {
      const p = productById(id); if(!p) return;
      if(confirm('Meldung für „' + p.name + '“ für 7 Tage ausblenden?\n(Beim nächsten Verbrauch wird sie wieder aktiv.)')) snooze(p, 24 * 7);
      break;
    }
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'cat': ui.catFilter = el.dataset.c; render(); break;
    case 'hf': ui.histFilter = el.dataset.f; render(); break;
    case 'hf-today': ui.histTodayOnly = !ui.histTodayOnly; render(); break;
    case 'toggle-fc': ui.listOpen[id] = !ui.listOpen[id]; render(); break;
    case 'hist-undo': undoLog(id); break;
    case 'hist-remove':
      if(confirm('Eintrag aus dem Verlauf entfernen? Der Bestand bleibt unverändert.')) removeLog(id);
      break;
    case 'shop-done': toggleShop(id); break;
    case 'shop-remove': removeShop(id); break;
    case 'shop-manual': addManualShop(); break;
    case 'shop-clear-done': {
      const n = state.shop.filter(s => s.done).length;
      if(n && confirm(`${n} erledigte Einträge von der Liste löschen?`)){ state.shop = state.shop.filter(s => !s.done); save(); render(); }
      break;
    }
    case 'go-shop': ui.tab = 'shop'; render(); window.scrollTo({top: 0}); break;
    case 'qty-add': {
      const inp = $('#b-qty'); const add = Number(el.dataset.n) || 0;
      inp.value = String(Math.round(((parseFloat(inp.value.replace(',', '.')) || 0) + add) * 100) / 100);
      break;
    }
    case 'qty-half': { const inp = $('#b-qty'); inp.value = String(Math.round(((parseFloat(inp.value.replace(',', '.')) || 0) / 2) * 100) / 100); break; }
    case 'qty-clear': { $('#b-qty').value = ''; $('#b-qty').focus(); break; }
    case 'export': doExport(); break;
    case 'export-csv': doExportCsv(); break;
    case 'import': $('#import-file')?.click(); break;
    case 'settings': openModal('settings'); break;
    case 'help': openModal('help'); break;
    case 'install': {
      toast('So geht’s: Im Browser unten auf „Teilen“ (iPhone: ⬆️) → „Zum Home-Bildschirm“ / „App installieren“. Danach startet die App wie eine normale App.', 'ok');
      break;
    }
    case 'reset-all': {
      if(confirm('Wirklich ALLE Daten löschen? (Produkte, Verlauf, Einkaufsliste).\nDas kann nicht rückgängig gemacht werden – sichere vorher ein Backup!')) {
        if(confirm('Letzte Rückfrage: wirklich alles löschen?')){
          localStorage.removeItem(KEY);
          state = structuredClone(DEFAULTS);
          closeModal(); render(); toast('Alle Daten wurden gelöscht.');
        }
      }
      break;
    }
  }
  if(el.tagName === 'INPUT' && el.dataset.act === 'shop-qty'){ /* handled below */ }
});

// Enter in Suche
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id === 'search'){
    ui.search = t.value;
    const pos = t.selectionStart;
    renderList();
    const s = $('#search');
    if(s){ s.focus(); try{ s.setSelectionRange(pos, pos); }catch(e){} }
    return;
  }
  if(t.dataset && t.dataset.act === 'shop-qty'){
    const s = state.shop.find(x => x.id === t.dataset.id);
    if(s){ const v = parseFloat(t.value.replace(',', '.')); s.qty = isNaN(v) ? 0 : v; save(); }
    return;
  }
  if(t.dataset && t.dataset.unit !== undefined) return;
  if(t.id === 'f-unit' || (t.closest && t.closest('#product-form') && t.id === 'f-unit')){}
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id === 'f-unit'){
    $$('[data-unit]').forEach(u => u.textContent = t.value);
  }
  if(t.id === 'import-file' && t.files && t.files[0]) handleImportFile(t.files[0]);
  if(t.dataset && t.dataset.act === 'shop-qty'){
    const s = state.shop.find(x => x.id === t.dataset.id);
    if(s){ const v = parseFloat(t.value.replace(',', '.')); if(isNaN(v) || v <= 0) s.qty = Math.max(1, s.qty || 1); save(); render(); }
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && $('#modal-root').children.length) closeModal();
});
$('#btn-menu').addEventListener('click', openMenu);
$('#fab').addEventListener('click', () => openModal('add'));

// „Später“ bestehende Pausen ablaufen lassen beim Start
function cleanupOldData(){
  const cutoff = Date.now() - (Number(state.settings.retentionDays) || 180) * DAY;
  // Verlauf behalten, aber sehr alten Bestands-„adj“-Einträge reduzieren (nur wenn extrem viele)
  if(state.log.length > 1500) state.log = state.log.slice(0, 1500);
  // Erledigte Einkäufe älter 30 Tage entfernen
  const oldDone = state.shop.filter(s => s.done && s.doneAt && s.doneAt < Date.now() - 30 * DAY);
  if(oldDone.length) state.shop = state.shop.filter(s => !oldDone.includes(s));
  return cutoff;
}

render();
window.__salonApp = { get state(){ return state; }, render, addProduct, book, addToShopping, toggleShop };
